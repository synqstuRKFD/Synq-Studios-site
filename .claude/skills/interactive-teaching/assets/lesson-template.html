<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive Lesson</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --text: #1d1d1f; --muted: #5f6368; --line: #e3e3df;
    --accent: #3a5bd9; --ok: #1e7a46; --ok-bg: #e6f4ec; --bad: #b3261e; --bad-bg: #fbeaea;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121214; --card: #1c1c1f; --text: #ececec; --muted: #a0a0a6; --line: #2e2e33;
      --accent: #8ea2ff; --ok: #6fd39b; --ok-bg: #16301f; --bad: #ff8a80; --bad-bg: #3a1a1a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .progress { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 8px; }
  .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: .9rem; margin-bottom: 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  .card h2 { margin-top: 0; font-size: 1.25rem; }
  pre { background: var(--bg); padding: 12px; border-radius: 8px; overflow-x: auto; }
  .choices { display: grid; gap: 8px; margin: 12px 0; }
  button { font: inherit; cursor: pointer; border-radius: 10px; padding: 10px 14px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); text-align: left; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); text-align: center; }
  button.correct { background: var(--ok-bg); border-color: var(--ok); }
  button.wrong { background: var(--bad-bg); border-color: var(--bad); }
  button:disabled { cursor: default; }
  .feedback { padding: 10px 12px; border-radius: 8px; margin: 8px 0; }
  .feedback.ok { background: var(--ok-bg); color: var(--ok); }
  .feedback.bad { background: var(--bad-bg); color: var(--bad); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .pill { display: inline-block; font-size: .8rem; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
  details { margin-top: 12px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="sub" id="subtitle"></p>
  <div class="progress" role="progressbar" aria-label="Lesson progress" aria-valuemin="0" aria-valuemax="100"><div id="bar"></div></div>
  <div class="meta"><span id="where"></span><span id="score"></span></div>
  <section id="view" aria-live="polite"></section>
</main>
<script>
/* ===== EDIT ONLY THIS OBJECT ===== */
const LESSON = {
  id: "example-lesson-v1",            // change per lesson: progress is stored under this key
  title: "How Compression Works",
  subtitle: "A 3-minute primer for home recording",
  modules: [
    {
      title: "What a compressor does",
      body: `<p>A compressor turns down the parts of a sound that go above a level you choose — the <b>threshold</b>.
             The <b>ratio</b> says how much: at 4:1, every 4 dB over the threshold comes out as 1 dB over.</p>
             <pre>Input:  -6 dB  (threshold -14 dB → 8 dB over)
Ratio:  4:1   → 8 / 4 = 2 dB over
Output: -12 dB</pre>`,
      exercise: { prompt: "Threshold -20 dB, ratio 2:1, input peak -10 dB. What is the output peak?",
                  solution: "10 dB over ÷ 2 = 5 dB over → -15 dB." },
      questions: [
        { q: "What does the threshold set?", level: 1,
          choices: ["The level where compression starts", "How loud the output is", "How fast the compressor reacts"],
          answer: 0, explain: "Only signal above the threshold gets turned down." },
        { q: "Threshold -12 dB, ratio 3:1, input -3 dB. Output?", level: 2,
          choices: ["-9 dB", "-6 dB", "-3 dB"],
          answer: 0, explain: "9 dB over ÷ 3 = 3 dB over → -9 dB." },
        { q: "A vocal has 12 dB over the threshold at 4:1. How much gain reduction?", level: 3,
          choices: ["3 dB", "9 dB", "12 dB"],
          answer: 1, explain: "Output is 12/4 = 3 dB over, so it was reduced by 12 − 3 = 9 dB." }
      ]
    },
    {
      title: "Attack and release",
      body: `<p><b>Attack</b> is how quickly compression kicks in; <b>release</b> is how quickly it lets go.
             Slow attack lets the start of a drum hit through (punch). Fast attack tames sharp peaks.</p>`,
      questions: [
        { q: "You want snare hits to keep their snap. Attack should be…", level: 1,
          choices: ["Slower", "Faster", "It doesn't matter"],
          answer: 0, explain: "A slower attack lets the transient pass before compression starts." },
        { q: "Very short release on a bass often causes…", level: 2,
          choices: ["Distortion/pumping", "More low end", "Less latency"],
          answer: 0, explain: "The compressor follows individual waveform cycles and distorts." }
      ]
    }
  ]
};
/* ===== END EDIT ===== */

(function () {
  const $ = (id) => document.getElementById(id);
  const view = $("view");
  const KEY = "lesson:" + LESSON.id;
  const store = {
    load() { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; } },
    save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) { /* storage blocked: keep in memory */ } }
  };
  const fresh = () => ({ module: 0, phase: "learn", correct: 0, answered: 0, level: 1, asked: {}, missed: [], done: false });
  let S = store.load() || fresh();

  $("title").textContent = LESSON.title;
  $("subtitle").textContent = LESSON.subtitle || "";
  document.title = LESSON.title;

  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const totalQ = LESSON.modules.reduce((n, m) => n + (m.questions || []).length, 0);

  function header() {
    const pct = S.done ? 100 : Math.round((S.module / LESSON.modules.length) * 100);
    $("bar").style.width = pct + "%";
    document.querySelector(".progress").setAttribute("aria-valuenow", pct);
    $("where").textContent = S.done ? "Complete" : `Module ${S.module + 1} of ${LESSON.modules.length}`;
    $("score").textContent = S.answered ? `Score ${S.correct}/${S.answered}` : "";
    store.save(S);
  }

  // Adaptive pick: closest unasked question to the current level (prefers exact level, then lower, then higher).
  function nextQuestion(mi) {
    const qs = (LESSON.modules[mi].questions || []).map((q, i) => ({ q, i }))
      .filter(({ i }) => !S.asked[mi + ":" + i]);
    if (!qs.length) return null;
    qs.sort((a, b) => Math.abs((a.q.level || 1) - S.level) - Math.abs((b.q.level || 1) - S.level)
      || (a.q.level || 1) - (b.q.level || 1));
    return qs[0];
  }

  function renderLearn() {
    const m = LESSON.modules[S.module];
    let html = `<div class="card"><h2>${esc(m.title)}</h2>${m.body}`;
    if (m.exercise) {
      html += `<div class="card" style="margin-top:12px"><b>Try it:</b> ${esc(m.exercise.prompt)}
        <details><summary>Show solution</summary><p>${esc(m.exercise.solution)}</p></details></div>`;
    }
    html += `<div class="row"><button class="primary" id="go">${(m.questions || []).length ? "Check my understanding" : "Next module"}</button></div></div>`;
    view.innerHTML = html;
    $("go").onclick = () => { S.phase = "quiz"; render(); };
    $("go").focus();
  }

  function renderQuiz(item, isReview) {
    const { q } = item;
    view.innerHTML = `<div class="card"><span class="pill">${isReview ? "Review" : "Level " + (q.level || 1)}</span>
      <h2>${esc(q.q)}</h2><div class="choices" role="group" aria-label="Answer choices">
      ${q.choices.map((c, i) => `<button data-i="${i}">${esc(c)}</button>`).join("")}</div>
      <div id="fb"></div><div class="row"><button class="primary" id="next" hidden>Continue</button></div></div>`;
    const buttons = [...view.querySelectorAll(".choices button")];
    buttons[0].focus();
    buttons.forEach((b) => b.onclick = () => {
      const pick = +b.dataset.i, ok = pick === q.answer;
      buttons.forEach((x) => { x.disabled = true; });
      b.classList.add(ok ? "correct" : "wrong");
      buttons[q.answer].classList.add("correct");
      $("fb").innerHTML = `<div class="feedback ${ok ? "ok" : "bad"}">${ok ? "Correct." : "Not quite."} ${esc(q.explain || "")}</div>`;
      S.answered++;
      if (ok) { S.correct++; S.level = Math.min(3, S.level + 1); }
      else { S.level = Math.max(1, S.level - 1); }
      if (isReview) {
        S.missed = S.missed.filter((k) => k !== item.key);
        if (!ok) S.missed.push(item.key); // still wrong: move to the back of the queue
      } else {
        S.asked[S.module + ":" + item.i] = true;
        if (!ok) S.missed.push(S.module + ":" + item.i);
      }
      header();
      $("next").hidden = false; $("next").focus();
      $("next").onclick = () => { if (isReview) S.phase = "review"; render(); };
    });
  }

  function renderReview() {
    if (!S.missed.length) { S.phase = "summary"; return render(); }
    const key = S.missed[0], [mi, qi] = key.split(":").map(Number);
    renderQuiz({ q: LESSON.modules[mi].questions[qi], key }, true);
  }

  function renderSummary() {
    S.done = true; header();
    const pct = S.answered ? Math.round((S.correct / S.answered) * 100) : 0;
    view.innerHTML = `<div class="card"><h2>Lesson complete</h2>
      <p>You answered ${S.correct} of ${S.answered} correctly (${pct}%) across ${totalQ} questions${S.missed.length ? ", with some still to review" : ""}.</p>
      <p>Come back in 1, 3 and 7 days and retake it — spaced review is what makes it stick.</p>
      <div class="row">${S.missed.length ? '<button id="rev">Review missed</button>' : ""}<button class="primary" id="restart">Start over</button></div></div>`;
    if ($("rev")) $("rev").onclick = () => { S.phase = "review"; S.done = false; render(); };
    $("restart").onclick = () => { S = fresh(); render(); };
  }

  function render() {
    header();
    if (S.phase === "summary") return renderSummary();
    if (S.phase === "review") return renderReview();
    if (S.phase === "learn") return renderLearn();
    const item = nextQuestion(S.module);
    if (item) return renderQuiz(item, false);
    // module finished
    if (S.module + 1 < LESSON.modules.length) { S.module++; S.phase = "learn"; return render(); }
    S.phase = S.missed.length ? "review" : "summary";
    render();
  }

  window.__lessonState = () => S; // handy for automated checks
  render();
})();
</script>
</body>
</html>
